services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-celia}
      MYSQL_DATABASE: ${DB_NAME:-bdsenha}
    volumes:
      - db_data:/var/lib/mysql
      # Só roda na primeira vez que o volume é criado (banco vazio).
      # Pra re-executar depois de mudar o schema, apague o volume
      # (docker compose down -v) ou rode o SQL manualmente.
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-celia}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no arquivo .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      BACKEND_URL: ${BACKEND_URL:-http://localhost}
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-celia}
      DB_NAME: ${DB_NAME:-bdsenha}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
      args:
        # Vazio de propósito: o Nginx desse mesmo container faz proxy
        # de /api, /auth e /socket.io pro backend, então o front chama
        # tudo em caminho relativo (mesma origem, sem CORS).
        VITE_API_URL: ""
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  db_data: