# frontend/nginx.conf
# Servido dentro do container do frontend. "backend" é o nome do
# serviço no docker-compose.yml (o Docker resolve isso via DNS interno).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Evita cache agressivo do index.html (senão o navegador pode
    # ficar servindo uma versão antiga da SPA depois de um deploy novo)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Assets com hash no nome (JS/CSS gerados pelo Vite) podem
    # cachear "para sempre" com segurança
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 30d;
        access_log off;
    }

    # ---------- API REST ----------
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- Autenticação (login, cadastro, Google OAuth, etc.) ----------
    location /auth/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- Socket.IO (tempo real) ----------
    # Precisa dos headers de upgrade pra manter a conexão WebSocket viva;
    # sem isso o Socket.IO cai pra long-polling puro.
    location /socket.io/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---------- SPA (React Router) ----------
    # Qualquer rota que não bateu em nada acima (/, /admin, /atendente,
    # /telao, /redefinir-senha, /acompanhar...) cai no index.html e o
    # React Router assume a partir daí.
    location / {
        try_files $uri /index.html;
    }
}
